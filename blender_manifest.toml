schema_version = "1.0.0"
id = "gs_capture_dome"
version = "0.5.0"
name = "GS Capture Dome"
tagline = "Generate multi-camera capture rigs and batch render views"
maintainer = "Chiesu"
type = "add-on"
website = "https://github.com/Chiesu/gs-capture-dome"
blender_version_min = "4.2.0"
license = ["SPDX:GPL-3.0-or-later"]

[permissions]
files = "Write rendered views and camera metadata to the selected output folder"

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc", ".git/", ".github/", "docs/", "scripts/", "tests/", "dist/", "*.zip", "*.md", ".gitignore"]
